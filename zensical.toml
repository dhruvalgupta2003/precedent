# The docs website (https://dhruvalgupta2003.github.io/precedent/). Preview: `make docs`.
[project]
site_name = "Precedent"
site_url = "https://dhruvalgupta2003.github.io/precedent/"
site_description = "Keep your team's decisions from being undone: Precedent checks every change against them."
repo_url = "https://github.com/dhruvalgupta2003/precedent"
repo_name = "dhruvalgupta2003/precedent"
edit_uri = "edit/main/docs/"
copyright = "Apache-2.0 · Built on FalkorDB"
docs_dir = "docs"
site_dir = ".cache/site"  # generated files live in .cache/ (git-ignored)
extra_css = ["assets/site.css"]
exclude_docs = """
spec.md
scenarios.md
"""
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "1. How it works" = "concepts.md" },
    { "2. See it in 2 minutes" = "try.md" },
    { "3. Set it up for your team" = "setup.md" },
    { "4. Real-life examples" = "examples.md" },
  ] },
  { "Guides" = [
    { "Tell it what to look for" = "covers.md" },
    { "Use it with Claude Code" = "claude-code.md" },
    { "Check every pull request" = "ci.md" },
    { "Fix outdated AI instructions" = "doctor.md" },
  ] },
  { "Help" = [
    { "Common problems" = "troubleshooting.md" },
    { "Words we use" = "glossary.md" },
    { "All commands" = "reference/commands.md" },
    { "The precedent.yaml file" = "reference/precedent-yaml.md" },
    { "Settings" = "reference/settings.md" },
  ] },
  { "About" = [
    { "Does it work?" = "evidence.md" },
    { "What it can't do yet" = "limits.md" },
    { "Roadmap" = "roadmap.md" },
    { "Design decisions" = "adr/index.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.tabs",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/scale"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "IBM Plex Sans"
code = "IBM Plex Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true

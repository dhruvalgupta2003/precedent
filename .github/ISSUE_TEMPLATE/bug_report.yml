name: Bug report
description: Something Precedent does is wrong, broken or surprising.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues go through the Security tab → Report a vulnerability, never an issue.**
        Please remove secrets, tokens and private data from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The command or action you ran, and what Precedent did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps (and input files, if any) that shows the problem.
      placeholder: |
        1. precedent ingest adr docs/adr --org demo
        2. precedent check --org demo --diff change.diff
        3. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options: [CLI, MCP server / coding agent, Session hooks, GitHub Action, Web UI, API, Ingestion / connectors, Not sure]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or a commit SHA"
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Pasted as code automatically. Redact secrets first.
      render: shell

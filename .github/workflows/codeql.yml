name: codeql
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "23 4 * * 1" }]   # weekly, catches new queries on unchanged code

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning on private repos needs paid GitHub Advanced Security; run once the repo is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read                   # CodeQL reads workflow-run metadata (required in private repos)
      security-events: write          # only this job may upload findings
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]   # our code and our workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

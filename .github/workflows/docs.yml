name: docs
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read          # least privilege: only the deploy job gets more

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:                  # every PR: docs match the code and the site builds with no warnings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: make docs-check
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with: { path: .cache/site }

  deploy:                 # main only: publish to https://dhruvalgupta2003.github.io/precedent/
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write        # publish the site
      id-token: write     # prove to Pages that this run belongs to this repo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

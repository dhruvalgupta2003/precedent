name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read          # least privilege: every job can only read the repo

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      falkordb:
        image: falkordb/falkordb:6.0.4@sha256:bef8acb1d8ed9ff8d2ea251767e75c6c05cfa759f7c6bc7e1c122f27d0ea4d7f
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: make lint          # ruff, format, codespell, deptry, import-linter contracts
      - run: make typecheck     # ty
      - run: make test          # all layers in parallel + coverage gates
        env: { FALKORDB_URL: "redis://localhost:6379", CI: "true" }   # CI=true: no database is a failure, not a skip
      - run: make test-integration   # the same graph tests on the built-in database (ADR0015)
        env: { PRECEDENT_TEST_DB: "embedded", CI: "true" }
      - run: make eval EVAL_FLAGS="--summary $GITHUB_STEP_SUMMARY"   # golden suites, offline replay; fails on a regression
        env: { FALKORDB_URL: "redis://localhost:6379" }

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }   # full history for secret scanning
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Secrets in the whole git history (the pre-commit hook only sees staged files)
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose
      - name: File hygiene (same hooks as local pre-commit; cannot be skipped with --no-verify)
        run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure
        env: { SKIP: no-commit-to-branch }   # a local guard; CI legitimately runs on main after merges
      - name: Vulnerabilities (all deps) and licence gate (shipped deps)
        run: make audit
      - name: Workflow security lint
        run: uvx zizmor@1.30.1 --offline .github/workflows

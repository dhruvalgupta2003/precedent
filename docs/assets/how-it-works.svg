<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
<title id="t">How Precedent helps</title>
<desc id="d">1. Your team decides and writes it down. 2. Precedent remembers which decisions still count. 3. Changes are checked before they land. The answer is Stop (it goes against a decision), Take a look (it might; a person decides), or All good (nothing is against it).</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b7c90"/>
  </marker>
  <style>
    .card { fill: #19212c; stroke: #2a3442; stroke-width: 2; }
    .num { fill: #2ee6c5; }
    .numtext { fill: #1b2430; font: 700 18px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #e8eef5; font: 700 23px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sub { fill: #8b9bb0; font: 400 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .line { stroke: #6b7c90; stroke-width: 2.5; fill: none; }
  </style>
</defs>

<rect width="1280" height="420" rx="18" fill="#0e141d"/>

<!-- Three steps -->
<rect class="card" x="40" y="36" width="340" height="140" rx="14"/>
<circle class="num" cx="78" cy="74" r="18"/><text class="numtext" x="78" y="80" text-anchor="middle">1</text>
<text class="title" x="62" y="128">Your team decides</text>
<text class="sub" x="62" y="156">and writes it down</text>

<rect class="card" x="470" y="36" width="340" height="140" rx="14"/>
<circle class="num" cx="508" cy="74" r="18"/><text class="numtext" x="508" y="80" text-anchor="middle">2</text>
<text class="title" x="492" y="128">Precedent remembers</text>
<text class="sub" x="492" y="156">which decisions still count</text>

<rect class="card" x="900" y="36" width="340" height="140" rx="14"/>
<circle class="num" cx="938" cy="74" r="18"/><text class="numtext" x="938" y="80" text-anchor="middle">3</text>
<text class="title" x="922" y="128">Changes are checked</text>
<text class="sub" x="922" y="156">before they land</text>

<line class="line" x1="386" y1="106" x2="462" y2="106" marker-end="url(#arrow)"/>
<line class="line" x1="816" y1="106" x2="892" y2="106" marker-end="url(#arrow)"/>

<!-- From step 3 to the three answers -->
<path class="line" d="M1070 176 V 222 H 210"/>
<line class="line" x1="210" y1="222" x2="210" y2="252" marker-end="url(#arrow)"/>
<line class="line" x1="640" y1="222" x2="640" y2="252" marker-end="url(#arrow)"/>
<line class="line" x1="1070" y1="222" x2="1070" y2="252" marker-end="url(#arrow)"/>

<!-- Stop -->
<rect x="40" y="260" width="340" height="124" rx="14" fill="#e5484d" fill-opacity="0.14" stroke="#e5484d" stroke-width="2"/>
<path d="M72 290 L88 290 L100 302 L100 318 L88 330 L72 330 L60 318 L60 302 z" fill="#e5484d"/>
<rect x="69" y="307" width="22" height="6" rx="2" fill="#ffffff"/>
<text class="title" x="118" y="318">Stop</text>
<text class="sub" x="62" y="364" fill="#c9d4df">It goes against a decision</text>

<!-- Take a look -->
<rect x="470" y="260" width="340" height="124" rx="14" fill="#d99a00" fill-opacity="0.14" stroke="#d99a00" stroke-width="2"/>
<path d="M510 288 L532 328 L488 328 z" fill="#d99a00" stroke="#d99a00" stroke-width="4" stroke-linejoin="round"/>
<rect x="508" y="300" width="4" height="15" rx="2" fill="#1b2430"/>
<circle cx="510" cy="321" r="2.6" fill="#1b2430"/>
<text class="title" x="548" y="318">Take a look</text>
<text class="sub" x="492" y="364" fill="#c9d4df">It might. A person decides.</text>

<!-- All good -->
<rect x="900" y="260" width="340" height="124" rx="14" fill="#2ee6c5" fill-opacity="0.12" stroke="#2ee6c5" stroke-width="2"/>
<circle cx="940" cy="310" r="20" fill="#2ee6c5"/>
<path d="M930 310 L937 318 L951 302" fill="none" stroke="#1b2430" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="title" x="978" y="318">All good</text>
<text class="sub" x="922" y="364" fill="#c9d4df">Nothing is against it</text>
</svg>
